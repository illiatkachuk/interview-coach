[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-coach"
version = "0.2.0"
description = "CLI and web trainer for technical interviews powered by the Anthropic API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
interview-coach = "interview_coach.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interview_coach = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
