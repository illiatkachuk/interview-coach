[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-coach"
version = "0.1.0"
description = "CLI-тренажер для технічних співбесід на базі Anthropic API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
interview-coach = "interview_coach.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
